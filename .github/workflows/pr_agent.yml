name: PR Agent (Gemini)

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  issue_comment:
    types: [created, edited]

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: write

jobs:
  pr_agent:
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' &&
       github.event.action == 'created' &&
       github.event.issue.pull_request &&
       github.event.sender.type != 'Bot' &&
       !contains(github.event.comment.body, '/sign-off') &&
       !contains(github.event.comment.body, '/autofix'))
    uses: JWEB0689/pr-agent-settings/.github/workflows/pr_agent.yml@main
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

  sign-off:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      github.event.sender.type != 'Bot' &&
      (contains(github.event.comment.body, '/sign-off') ||
       contains(github.event.comment.body, '/autofix') ||
       contains(github.event.comment.body, '- [x] <!-- muse-sign-off -->') ||
       contains(github.event.comment.body, '- [X] <!-- muse-sign-off -->'))
    uses: JWEB0689/pr-agent-settings/.github/workflows/reusable_autofix.yml@main
    with:
      mode: pr
      pr_number: ${{ github.event.issue.number }}
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
